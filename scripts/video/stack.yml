# The usage video's own Kafka (9592) and Apicurio registry (8580), on ports of their own so no one else's Kafka is
# touched. scripts/video/take.sh starts and removes it.
name: rif-video
services:
  kafka:
    image: apache/kafka:4.4.0
    ports: ["9592:9592"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9592,CONTROLLER://:9593
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9592
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9593
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9592 > /dev/null 2>&1"]
      interval: 3s
      retries: 30
  apicurio:
    image: apicurio/apicurio-registry:3.3.3
    ports: ["8580:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v3/system/info > /dev/null || exit 1"]
      interval: 3s
      retries: 40
