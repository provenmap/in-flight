# in-flight's stack: Kafka in KRaft mode, a schema registry, and the Kroxylicious proxy with this repository's
# filters (the intent.<name> alias and the schema gate). The simulator, router and console run on the host.
#   in-flight up     starts it and waits until it is healthy
#   in-flight down   stops it and deletes its data
# Kafka on 9092 (and kafka:19092 inside), the registry on 8080, the proxy on 9192.
name: in-flight

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: rKq3pY0sT8i2Vf6wXn1aBg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  apicurio:
    image: apicurio/apicurio-registry:3.3.3
    ports:
      - "8080:8080"
    environment:
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v3/system/info > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  proxy:
    image: quay.io/kroxylicious/proxy:0.25.1
    command: ["--config", "/opt/in-flight/proxy.yaml"]
    environment:
      KROXYLICIOUS_CLASSPATH: /opt/in-flight/in-flight-proxy-filter.jar
    volumes:
      - ./stack/proxy.yaml:/opt/in-flight/proxy.yaml:ro
      - ./stack/in-flight-proxy-filter.jar:/opt/in-flight/in-flight-proxy-filter.jar:ro
    ports:
      - "9192-9195:9192-9195"
    depends_on:
      kafka:
        condition: service_healthy
