<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revenue in Flight</title>
  <meta name="description" content="Order-to-cash, live from Kafka: every event is a particle worth its money, and a schema change jams Payments.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffc857'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage" aria-label="The order-to-cash flow, live"></div>

  <header class="brand">
    <h1>Revenue in Flight</h1>
    <p>Order-to-cash, live from Kafka</p>
    <p class="conn" data-testid="connection"><span class="dot"></span><span class="conn-text">connecting</span></p>
  </header>

  <section class="hud" data-testid="hud" aria-live="polite">
    <div class="hud-label">Money at risk</div>
    <div class="hud-value" data-testid="at-risk">$0.00</div>
    <div class="hud-sub" data-testid="at-risk-sub">nothing held up</div>
    <div class="hud-parts">
      <span class="part stuck" data-testid="stuck">stuck $0</span>
      <span class="part lag" data-testid="lag">in lag $0</span>
    </div>
    <div class="recovered-banner" data-testid="recovered" hidden></div>
  </section>

  <aside class="side">
    <div class="view-toggle" role="group" aria-label="View">
      <button type="button" data-view="3d">3D</button>
      <button type="button" data-view="2d">2D</button>
    </div>
    <div class="legend" aria-label="Particle size and brightness by value">
      <div class="legend-title">Each event, by value</div>
      <div class="legend-row"></div>
      <div class="legend-keys">
        <span><i class="k redrive"></i>redriven</span>
        <span><i class="k dead"></i>dead letter</span>
        <span><i class="k declined"></i>declined</span>
      </div>
    </div>
  </aside>

  <footer class="controls">
    <p class="hint" data-testid="hint"></p>
    <div class="control-row">
      <div class="group">
        <span class="group-label">Orders team</span>
        <button type="button" data-action="break" data-testid="break">Ship OrderPlaced v2</button>
        <button type="button" data-action="restore" class="quiet">Back to v1</button>
      </div>
      <div class="group">
        <span class="group-label">Payments team</span>
        <button type="button" data-action="patch" data-testid="patch">Patch payments</button>
        <button type="button" data-action="redrive" data-testid="redrive">Redrive DLQ</button>
        <button type="button" data-action="unpatch" class="quiet">Unpatch</button>
      </div>
      <div class="group rate">
        <label class="group-label" for="rate">Traffic</label>
        <input id="rate" type="range" min="0" max="60" step="1" value="8">
        <output for="rate" data-testid="rate">8/s</output>
      </div>
    </div>
    <p class="state" data-testid="sim-state"></p>
  </footer>

  <div class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
