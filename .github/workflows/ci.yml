name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: end to end, on Kafka in Compose
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose up -d --wait
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The Kafka client, the simulator (milestone 1), the observer (milestone 3) and the MCP server, over stdio and HTTP.
      - run: npm run test:e2e
      # The view in a browser (milestone 2): 3D, 2D, phone width, break and recover.
      - run: npm run test:browser
      - if: failure()
        run: docker compose logs kafka
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
