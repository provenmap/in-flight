name: release

# On a version tag (v0.3.0): the container image, self-contained downloads for Linux, macOS and Windows (no JDK
# needed), a GitHub release carrying them, and the Homebrew formula pushed to the tap. Needs the repository to be on
# GitHub (PRODUCT.md, decision 5) and, for the tap, a HOMEBREW_TAP_TOKEN secret that can push to <owner>/homebrew-tap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21, cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm run build
      - run: ./mvnw -B -ntp versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        with: {name: jar, path: cli/target/revenue-in-flight.jar}

  image:
    needs: jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  downloads:
    needs: jar
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: actions/download-artifact@v4
        with: {name: jar, path: cli/target}
      - run: packaging/jpackage.sh ${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with: {name: "download-${{ matrix.os }}", path: dist/release/*}

  publish:
    needs: [image, downloads]
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "download-*", path: release, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: jar, path: release}
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          v=${GITHUB_REF_NAME#v}
          sum() { grep " $1\$" release/SHA256SUMS | cut -d' ' -f1; }
          sed -e "s|@REPOSITORY@|$GITHUB_REPOSITORY|g" -e "s|@VERSION@|$v|g" \
              -e "s|@SHA_MACOS_ARM64@|$(sum revenue-in-flight-$v-macos-arm64.tar.gz)|" \
              -e "s|@SHA_MACOS_X64@|$(sum revenue-in-flight-$v-macos-x64.tar.gz)|" \
              -e "s|@SHA_LINUX_X64@|$(sum revenue-in-flight-$v-linux-x64.tar.gz)|" \
              packaging/homebrew/revenue-in-flight.rb > revenue-in-flight.rb
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap" tap
          mkdir -p tap/Formula && cp revenue-in-flight.rb tap/Formula/
          cd tap && git add Formula && git -c user.name=release -c user.email=release@users.noreply.github.com commit -m "revenue-in-flight $v" && git push
