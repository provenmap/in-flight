name: in-flight impact
description: >-
  For a pull request that changes a in-flight catalog: every event version it adds, which consumers it
  reaches, and who must change before it ships. Fails the check when a consumer must change first.
branding:
  icon: shield
  color: green
inputs:
  catalog:
    description: The catalog file in the repository, such as flows/checkout.json
    required: true
  base:
    description: The git ref to compare with (default the pull request's base branch)
    required: false
    default: ""
  image:
    description: The in-flight image to run
    required: false
    default: ghcr.io/provenmap/in-flight:latest
outputs:
  report:
    description: The impact report, as text
    value: ${{ steps.impact.outputs.report }}
runs:
  using: composite
  steps:
    - name: The catalog at the base
      shell: bash
      env:
        BASE: ${{ inputs.base || github.base_ref || 'HEAD~1' }}
        CATALOG: ${{ inputs.catalog }}
      run: |
        git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
        ref="origin/$BASE"; git rev-parse -q --verify "$ref" >/dev/null || ref="$BASE"
        mkdir -p "$RUNNER_TEMP/in-flight"
        if git show "$ref:$CATALOG" > "$RUNNER_TEMP/in-flight/base.json" 2>/dev/null; then :; else echo '{"events":[]}' > "$RUNNER_TEMP/in-flight/base.json"; fi
    - name: Impact
      id: impact
      shell: bash
      env:
        CATALOG: ${{ inputs.catalog }}
        IMAGE: ${{ inputs.image }}
      run: |
        set +e
        docker run --rm -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/in-flight:/base" "$IMAGE" impact --since /base/base.json "/w/$CATALOG" > "$RUNNER_TEMP/in-flight/report.txt"
        code=$?
        set -e
        cat "$RUNNER_TEMP/in-flight/report.txt"
        { echo "report<<INFLIGHT_EOF"; cat "$RUNNER_TEMP/in-flight/report.txt"; echo "INFLIGHT_EOF"; } >> "$GITHUB_OUTPUT"
        { echo '```'; cat "$RUNNER_TEMP/in-flight/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit $code
